[package]
name = "content2srs"
version = "0.1.0"
edition = "2021"
description = "Fast, resilient subtitle-to-Anki media engine"
license = "MIT"
rust-version = "1.80"

[lib]
name = "content2srs"
path = "src/lib.rs"

[[bin]]
name = "content2srs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8"
md5 = "0.7"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
